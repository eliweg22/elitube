<!DOCTYPE html>
<html lang="de" class="h-full bg-[#0f0f0f] text-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliTube & EliClipz</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .reel-container {
            scroll-snap-type: y mandatory;
        }
        .reel-item {
            scroll-snap-align: start;
        }
        /* Gradient Bar from Bild 4 */
        .progress-gradient-bar {
            background: linear-gradient(90deg, #ff0000 0%, #8000ff 50%, #0000ff 100%);
        }
        .player-gradient-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0) 100%);
        }
        /* Fullscreen Support Overlay */
        :fullscreen #custom-player-container,
        :-webkit-full-screen #custom-player-container {
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
        }
    </style>
</head>
<body class="h-full flex flex-col bg-[#0f0f0f] text-gray-100 overflow-hidden">

    <!-- APP CONTAINER -->
    <div id="app" class="h-full flex flex-col"></div>

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 bg-zinc-800 border border-zinc-700 text-white px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 z-50 flex items-center space-x-3 pointer-events-none">
        <i id="toast-icon" class="fas fa-check-circle text-green-400 text-lg"></i>
        <span id="toast-msg" class="font-medium text-sm"></span>
    </div>

    <!-- MAIN JAVASCRIPT APP LOGIC -->
    <script>
        // Initial Empty Video List
        const INITIAL_VIDEOS = [];

        // System Default User
        const SYSTEM_USERS = [
            {
                username: 'Test Benutzer',
                handle: 'Test',
                email: 'test@example.com',
                password: 'uni123versal',
                avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Test',
                banner: '',
                bio: 'Willkommen auf meinem offiziellen Test-Kanal!'
            }
        ];

        // MARKDOWN FORMATTER (*kursiv*, **fett**)
        function parseMarkdown(text) {
            if (!text) return '';
            let parsed = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            // Bold **text**
            parsed = parsed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Italic *text*
            parsed = parsed.replace(/\*(.*?)\*/g, '<em>$1</em>');
            return parsed;
        }

        // STORE MANAGEMENT
        class Store {
            constructor() {
                this.loadState();
            }

            loadState() {
                const storedUsers = localStorage.getItem('elitube_users');
                this.users = storedUsers ? JSON.parse(storedUsers) : SYSTEM_USERS;

                const currentUser = localStorage.getItem('elitube_current_user');
                this.currentUser = currentUser ? JSON.parse(currentUser) : null;

                const storedVideos = localStorage.getItem('elitube_videos');
                this.videos = storedVideos ? JSON.parse(storedVideos) : INITIAL_VIDEOS;

                const storedCounter = localStorage.getItem('elitube_video_counter');
                this.videoCounter = storedCounter ? parseInt(storedCounter, 10) : 1;

                const storedInteractions = localStorage.getItem('elitube_user_interactions');
                this.interactions = storedInteractions ? JSON.parse(storedInteractions) : {
                    likedVideos: [],
                    dislikedVideos: [],
                    subscriptions: [],
                    bells: {}
                };

                this.currentTab = 'home';
                this.activeVideoId = null;
                this.searchQuery = '';
            }

            saveState() {
                localStorage.setItem('elitube_users', JSON.stringify(this.users));
                localStorage.setItem('elitube_current_user', JSON.stringify(this.currentUser));
                localStorage.setItem('elitube_videos', JSON.stringify(this.videos));
                localStorage.setItem('elitube_video_counter', this.videoCounter.toString());
                localStorage.setItem('elitube_user_interactions', JSON.stringify(this.interactions));
            }

            registerUser(name, handle, email, password, avatarUrl) {
                const exists = this.users.some(u => u.handle.toLowerCase() === handle.toLowerCase());
                if (exists) return { success: false, msg: `Der @Name "@${handle}" ist bereits vergeben!` };

                const newUser = {
                    username: name,
                    handle: handle,
                    email: email,
                    password: password,
                    avatar: avatarUrl || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(handle)}`,
                    banner: '',
                    bio: ''
                };

                this.users.push(newUser);
                this.currentUser = newUser;
                this.saveState();
                this.downloadProfileFile(newUser);

                return { success: true };
            }

            updateProfile(data) {
                if (!this.currentUser) return;
                
                if (data.handle.toLowerCase() !== this.currentUser.handle.toLowerCase()) {
                    const exists = this.users.some(u => u.handle.toLowerCase() === data.handle.toLowerCase());
                    if (exists) return { success: false, msg: `Der @Name "@${data.handle}" ist bereits vergeben!` };
                }

                this.currentUser.username = data.username;
                this.currentUser.handle = data.handle;
                if (data.avatar) this.currentUser.avatar = data.avatar;
                if (data.banner !== undefined) this.currentUser.banner = data.banner;
                this.currentUser.bio = data.bio;

                const idx = this.users.findIndex(u => u.email === this.currentUser.email);
                if (idx !== -1) this.users[idx] = this.currentUser;

                this.saveState();
                this.downloadProfileFile(this.currentUser);
                return { success: true };
            }

            downloadProfileFile(user) {
                const profileContent = `Username: ${user.username}\n@Handle: ${user.handle}\nEmail: ${user.email}\nBio: ${user.bio || 'Keine'}\nSavePath: /profile/${user.handle}.txt`;
                const blob = new Blob([profileContent], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${user.handle}_profile.txt`;
                showToast(`Profil-Daten in /profile/${user.handle}.txt indiziert! 📂`);
            }

            loginUser(identifier, password) {
                const user = this.users.find(u => 
                    (u.handle.toLowerCase() === identifier.toLowerCase() || u.email.toLowerCase() === identifier.toLowerCase()) && 
                    u.password === password
                );

                if (user) {
                    this.currentUser = user;
                    this.saveState();
                    return { success: true };
                }
                return { success: false, msg: 'Ungültiger @Name/E-Mail oder falsches Passwort!' };
            }

            logout() {
                this.currentUser = null;
                localStorage.removeItem('elitube_current_user');
                this.currentTab = 'home';
                renderApp();
            }

            toggleLike(videoId) {
                const isLiked = this.interactions.likedVideos.includes(videoId);
                const video = this.videos.find(v => v.id === videoId);

                if (isLiked) {
                    this.interactions.likedVideos = this.interactions.likedVideos.filter(id => id !== videoId);
                    if (video) video.likes--;
                } else {
                    this.interactions.likedVideos.push(videoId);
                    if (video) video.likes++;

                    if (this.interactions.dislikedVideos.includes(videoId)) {
                        this.interactions.dislikedVideos = this.interactions.dislikedVideos.filter(id => id !== videoId);
                        if (video) video.dislikes--;
                    }
                }
                this.saveState();
                renderApp();
            }

            toggleDislike(videoId) {
                const isDisliked = this.interactions.dislikedVideos.includes(videoId);
                const video = this.videos.find(v => v.id === videoId);

                if (isDisliked) {
                    this.interactions.dislikedVideos = this.interactions.dislikedVideos.filter(id => id !== videoId);
                    if (video) video.dislikes--;
                } else {
                    this.interactions.dislikedVideos.push(videoId);
                    if (video) video.dislikes++;

                    if (this.interactions.likedVideos.includes(videoId)) {
                        this.interactions.likedVideos = this.interactions.likedVideos.filter(id => id !== videoId);
                        if (video) video.likes--;
                    }
                }
                this.saveState();
                renderApp();
            }

            toggleSub(authorHandle) {
                const isSubbed = this.interactions.subscriptions.includes(authorHandle);
                if (isSubbed) {
                    this.interactions.subscriptions = this.interactions.subscriptions.filter(h => h !== authorHandle);
                    delete this.interactions.bells[authorHandle];
                    showToast(`Abonnement für @${authorHandle} beendet`);
                } else {
                    this.interactions.subscriptions.push(authorHandle);
                    this.interactions.bells[authorHandle] = 'all';
                    showToast(`@${authorHandle} abonniert! 🎉`);
                }
                this.saveState();
                renderApp();
            }

            cycleBell(authorHandle) {
                if (!this.interactions.subscriptions.includes(authorHandle)) return;
                const states = ['all', 'personalized', 'none'];
                const current = this.interactions.bells[authorHandle] || 'all';
                const nextIndex = (states.indexOf(current) + 1) % states.length;
                const nextState = states[nextIndex];

                this.interactions.bells[authorHandle] = nextState;
                this.saveState();

                const labelMap = { all: 'Alle Benachrichtigungen', personalized: 'Personalisierte Benachrichtigungen', none: 'Keine Benachrichtigungen' };
                showToast(`${labelMap[nextState]} für @${authorHandle}`);
                renderApp();
            }

            addComment(videoId, commentText) {
                if (!commentText.trim()) return;
                const video = this.videos.find(v => v.id === videoId);
                if (video) {
                    video.comments.unshift({
                        id: 'comm-' + Date.now(),
                        author: this.currentUser.username,
                        handle: this.currentUser.handle,
                        text: commentText.trim(),
                        date: 'Gerade eben'
                    });
                    this.saveState();
                    renderApp();
                }
            }

            addVideo(videoData) {
                const formattedId = String(this.videoCounter).padStart(3, '0');
                this.videoCounter++;

                const videoPath = `/EliVideos/${formattedId}.mp4`;
                const thumbPath = `/EliVideos/Thumbnail/${formattedId}.jpg`;
                const titleTxtPath = `/EliVideos/Titel/${formattedId}.txt`;
                const nowStamp = new Date().toLocaleString('de-DE');

                // Content formatted strictly:
                // %Titel%
                // %Beschreibung%
                // %Uploadzeit und datum%
                const txtContent = `${videoData.title}\n${videoData.description || 'Keine Beschreibung'}\n${nowStamp}`;

                const newVid = {
                    id: formattedId,
                    title: videoData.title,
                    description: videoData.description,
                    url: videoData.url,
                    thumbnail: videoData.thumbnail || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop&q=80',
                    author: this.currentUser.username,
                    authorHandle: this.currentUser.handle,
                    authorAvatar: this.currentUser.avatar,
                    views: 1,
                    createdAt: nowStamp,
                    likes: 0,
                    dislikes: 0,
                    isShort: videoData.isShort,
                    comments: [],
                    filePaths: {
                        video: videoPath,
                        thumbnail: thumbPath,
                        titleTxt: titleTxtPath
                    }
                };

                // Trigger TXT File Download for local /EliVideos/Titel/
                const blob = new Blob([txtContent], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${formattedId}.txt`;
                a.click();

                this.videos.unshift(newVid);
                this.saveState();

                if (videoData.isShort) {
                    this.currentTab = 'clipz';
                } else {
                    this.currentTab = 'home';
                }
                showToast(`Video in ${videoPath} & Titel-TXT in ${titleTxtPath} gespeichert! 📁`);
                renderApp();
            }
        }

        const store = new Store();

        // UTILS
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            const iconEl = document.getElementById('toast-icon');

            if (!toast || !msgEl || !iconEl) return;
            msgEl.textContent = message;
            toast.className = `fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-0 opacity-100 z-50 flex items-center space-x-3 pointer-events-auto ${isError ? 'bg-red-600 border-red-500' : 'bg-zinc-800 border border-zinc-700 text-white'}`;
            iconEl.className = isError ? 'fas fa-exclamation-circle text-red-300 text-lg' : 'fas fa-check-circle text-green-400 text-lg';

            setTimeout(() => {
                toast.className = toast.className.replace('translate-y-0 opacity-100', 'translate-y-20 opacity-0 pointer-events-none');
            }, 3500);
        }

        function copyShareLink(videoId) {
            const dummyUrl = window.location.origin + window.location.pathname + `?v=${videoId}`;
            navigator.clipboard.writeText(dummyUrl).then(() => {
                showToast('Video-Link in Zwischenablage kopiert! 🔗');
            }).catch(() => {
                showToast('Link kopiert!');
            });
        }

        function navigateTo(tab, videoId = null) {
            store.currentTab = tab;
            if (videoId) store.activeVideoId = videoId;
            renderApp();
        }

        function handleSearch(val) {
            store.searchQuery = val;
            renderApp();
        }

        let isCaptchaVerified = false;

        function togglePasswordVisibility(fieldId, iconId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(iconId);
            if (!field || !icon) return;
            if (field.type === 'password') {
                field.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                field.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // AUTHENTICATION VIEW
        function renderAuthView(isRegister = false) {
            isCaptchaVerified = false;
            return `
                <div class="min-h-screen w-full flex items-center justify-center bg-[#0f0f0f] px-4 py-8 relative">
                    <div class="absolute w-96 h-96 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>

                    <div class="w-full max-w-md bg-[#1f1f1f] border border-zinc-800 rounded-2xl p-6 sm:p-8 shadow-2xl z-10 relative">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center space-x-2">
                                <div class="bg-red-600 text-white p-2 rounded-xl text-2xl font-bold flex items-center justify-center w-12 h-10 shadow-lg shadow-red-600/30">
                                    <i class="fas fa-play"></i>
                                </div>
                                <span class="text-2xl font-extrabold tracking-tight text-white">Eli<span class="text-red-600">Tube</span></span>
                            </div>
                            <p class="text-xs text-zinc-400 mt-2">Melde dich an, um Videos, EliClipz und Kommentare zu sehen.</p>
                        </div>

                        <div class="flex bg-[#0f0f0f] p-1 rounded-xl mb-6">
                            <button onclick="switchAuthTab(false)" class="flex-1 py-2 text-sm font-semibold rounded-lg transition ${!isRegister ? 'bg-[#2a2a2a] text-white shadow' : 'text-zinc-400 hover:text-white'}">
                                Anmelden
                            </button>
                            <button onclick="switchAuthTab(true)" class="flex-1 py-2 text-sm font-semibold rounded-lg transition ${isRegister ? 'bg-[#2a2a2a] text-white shadow' : 'text-zinc-400 hover:text-white'}">
                                Registrieren
                            </button>
                        </div>

                        ${isRegister ? `
                            <form onsubmit="handleRegister(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Benutzername</label>
                                    <input type="text" id="reg-name" required placeholder="z.B. Alex Schmidt" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600 transition">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-zinc-400 mb-1">@Name (Eindeutiger Tag)</label>
                                    <div class="relative">
                                        <span class="absolute left-4 top-2.5 text-zinc-500 text-sm">@</span>
                                        <input type="text" id="reg-handle" required placeholder="alex_s" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl pl-8 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600 transition">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-zinc-400 mb-1">E-Mail</label>
                                    <input type="email" id="reg-email" required placeholder="alex@example.com" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600 transition">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Profilbild (Optional, 1:1 format)</label>
                                    <input type="file" id="reg-avatar-file" accept="image/*" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-4 py-2 text-xs text-zinc-300 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-white cursor-pointer">
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Passwort</label>
                                        <div class="relative">
                                            <input type="password" id="reg-pass1" required placeholder="••••••••" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl pl-4 pr-10 py-2.5 text-sm text-white focus:outline-none focus:border-red-600 transition">
                                            <button type="button" onclick="togglePasswordVisibility('reg-pass1', 'reg-pass1-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white text-xs">
                                                <i id="reg-pass1-icon" class="fas fa-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Wiederholen</label>
                                        <div class="relative">
                                            <input type="password" id="reg-pass2" required placeholder="••••••••" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl pl-4 pr-10 py-2.5 text-sm text-white focus:outline-none focus:border-red-600 transition">
                                            <button type="button" onclick="togglePasswordVisibility('reg-pass2', 'reg-pass2-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white text-xs">
                                                <i id="reg-pass2-icon" class="fas fa-eye"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div class="bg-[#0f0f0f] border border-zinc-800 rounded-xl p-3 flex items-center justify-between mt-2">
                                    <label class="flex items-center space-x-3 cursor-pointer">
                                        <input type="checkbox" id="captcha-check" onchange="isCaptchaVerified = this.checked" class="w-5 h-5 rounded border-zinc-700 bg-zinc-900 text-red-600 focus:ring-0 cursor-pointer">
                                        <span class="text-xs text-zinc-300 font-medium">Ich bin kein Roboter</span>
                                    </label>
                                    <div class="flex flex-col items-center">
                                        <i class="fas fa-shield-alt text-red-500 text-lg"></i>
                                        <span class="text-[9px] text-zinc-500">reCAPTCHA Fake</span>
                                    </div>
                                </div>

                                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-red-600/30 transition duration-200 mt-2">
                                    Konto erstellen
                                </button>
                            </form>
                        ` : `
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-zinc-400 mb-1">@Name ODER E-Mail</label>
                                    <input type="text" id="login-id" required placeholder="Test ODER test@example.com" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-red-600 transition">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Passwort</label>
                                    <div class="relative">
                                        <input type="password" id="login-pass" required placeholder="uni123versal" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl pl-4 pr-10 py-3 text-sm text-white focus:outline-none focus:border-red-600 transition">
                                        <button type="button" onclick="togglePasswordVisibility('login-pass', 'login-pass-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-white text-sm">
                                            <i id="login-pass-icon" class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="bg-[#0f0f0f] border border-zinc-800 rounded-xl p-3 flex items-center justify-between mt-2">
                                    <label class="flex items-center space-x-3 cursor-pointer">
                                        <input type="checkbox" id="captcha-check" onchange="isCaptchaVerified = this.checked" class="w-5 h-5 rounded border-zinc-700 bg-zinc-900 text-red-600 focus:ring-0 cursor-pointer">
                                        <span class="text-xs text-zinc-300 font-medium">Ich bin kein Roboter</span>
                                    </label>
                                    <div class="flex flex-col items-center">
                                        <i class="fas fa-shield-alt text-red-500 text-lg"></i>
                                        <span class="text-[9px] text-zinc-500">reCAPTCHA Fake</span>
                                    </div>
                                </div>

                                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-red-600/30 transition duration-200 mt-2">
                                    Anmelden
                                </button>
                            </form>

                            <div class="mt-6 bg-[#0f0f0f] p-3 rounded-xl border border-zinc-800/80 text-xs text-zinc-400">
                                <span class="font-bold text-red-500">Test-Zugang:</span><br>
                                @Name: <code class="text-white bg-zinc-800 px-1 py-0.5 rounded">Test</code> | Passwort: <code class="text-white bg-zinc-800 px-1 py-0.5 rounded">uni123versal</code>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        let isAuthRegisterMode = false;
        function switchAuthTab(toRegister) {
            isAuthRegisterMode = toRegister;
            renderApp();
        }

        function handleRegister(e) {
            e.preventDefault();
            if (!isCaptchaVerified) {
                showToast('Bitte bestätige das reCAPTCHA ("Ich bin kein Roboter")', true);
                return;
            }

            const name = document.getElementById('reg-name').value;

        // ATTACH PLAYER EVENTS FOR CUSTOM VIDEO CONTROLS
        function attachCustomPlayerEvents(videoId) {
            setTimeout(() => {
                const playerContainer = document.getElementById('custom-player-container');
                const video = document.getElementById('custom-video-el');
                if (!video || !playerContainer) return;

                const playBtn = document.getElementById('btn-play-pause');
                const playIcon = document.getElementById('icon-play-pause');
                const volumeSlider = document.getElementById('volume-slider');
                const timeStamp = document.getElementById('timestamp-display');
                const progressBar = document.getElementById('progress-bar');
                const progressFilled = document.getElementById('progress-filled');
                const fullscreenBtn = document.getElementById('btn-fullscreen');

                playerContainer.addEventListener('contextmenu', e => e.preventDefault());

                function togglePlay() {
                    if (video.paused) {
                        video.play();
                        if (playIcon) playIcon.className = 'fas fa-pause text-white';
                    } else {
                        video.pause();
                        if (playIcon) playIcon.className = 'fas fa-play text-white';
                    }
                }

                if (playBtn) playBtn.onclick = togglePlay;
                video.onclick = togglePlay;

                if (fullscreenBtn) {
                    fullscreenBtn.onclick = () => {
                        if (!document.fullscreenElement) {
                            if (playerContainer.requestFullscreen) {
                                playerContainer.requestFullscreen();
                            } else if (playerContainer.webkitRequestFullscreen) {
                                playerContainer.webkitRequestFullscreen();
                            }
                        } else {
                            if (document.exitFullscreen) {
                                document.exitFullscreen();
                            }
                        }
                    };
                }

                if (volumeSlider) {
                    volumeSlider.oninput = (e) => {
                        video.volume = e.target.value;
                    };
                }

                video.ontimeupdate = () => {
                    const current = formatTime(video.currentTime);
                    const duration = formatTime(video.duration || 0);
                    if (timeStamp) timeStamp.textContent = `${current} / ${duration}`;
                    
                    if (progressBar && video.duration) {
                        const pct = (video.currentTime / video.duration) * 100;
                        if (progressFilled) progressFilled.style.width = `${pct}%`;
                    }
                };

                if (progressBar) {
                    progressBar.onclick = (e) => {
                        const rect = progressBar.getBoundingClientRect();
                        const pos = (e.clientX - rect.left) / rect.width;
                        video.currentTime = pos * video.duration;
                    };
                }
            }, 50);
        }

                                            <button onclick="store.toggleSub('${clip.authorHandle}')" class="ml-auto px-3 py-1 rounded-full text-xs font-bold ${isSubbed ? 'bg-zinc-800 text-zinc-300' : 'bg-white text-black'}">
                                                ${isSubbed ? 'Abonniert' : 'Abo'}
                                            </button>
                                        </div>
                                        <p class="text-xs text-white line-clamp-2">${parseMarkdown(clip.title)}</p>
                                    </div>

                                    <div class="absolute right-3 bottom-24 flex flex-col items-center space-y-4 z-10">
                                        <button onclick="store.toggleLike('${clip.id}')" class="flex flex-col items-center">
                                            <div class="w-11 h-11 bg-zinc-900/80 backdrop-blur rounded-full flex items-center justify-center border border-zinc-700/50 ${isLiked ? 'text-red-500' : 'text-white'}">
                                                <i class="fas fa-heart text-lg"></i>
                                            </div>
                                            <span class="text-[10px] text-white font-bold mt-1">${clip.likes}</span>
                                        </button>
                                        <button onclick="navigateTo('watch', '${clip.id}')" class="flex flex-col items-center">
                                            <div class="w-11 h-11 bg-zinc-900/80 backdrop-blur rounded-full flex items-center justify-center border border-zinc-700/50 text-white">
                                                <i class="fas fa-comment text-lg"></i>
                                            </div>
                                            <span class="text-[10px] text-white font-bold mt-1">${clip.comments.length}</span>
                                        </button>
                                        <button onclick="copyShareLink('${clip.id}')" class="flex flex-col items-center">
                                            <div class="w-11 h-11 bg-zinc-900/80 backdrop-blur rounded-full flex items-center justify-center border border-zinc-700/50 text-white">
                                                <i class="fas fa-share text-lg"></i>
                                            </div>
                                            <span class="text-[10px] text-white font-bold mt-1">Teilen</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        // VIEW: ABOS
        function renderAbosView() {
            const subHandles = store.interactions.subscriptions;
            const subbedVideos = store.videos.filter(v => subHandles.includes(v.authorHandle));

            return `
                <div class="flex-1 overflow-y-auto p-4 sm:p-6">
                    <div class="max-w-7xl mx-auto space-y-6">
                        <div class="flex items-center justify-between border-b border-zinc-800 pb-4">
                            <h2 class="text-xl font-bold text-white flex items-center space-x-2">
                                <i class="fas fa-layer-group text-red-600"></i>
                                <span>Abonnierte Kanäle & Videos</span>
                            </h2>
                            <span class="text-xs text-zinc-400">${subHandles.length} Abonnements</span>
                        </div>

                        ${subbedVideos.length === 0 ? `
                            <div class="text-center py-16 space-y-4">
                                <i class="fas fa-bell-slash text-4xl text-zinc-600"></i>
                                <p class="text-zinc-400 text-sm">Du hast noch keine Kanäle abonniert.</p>
                            </div>
                        ` : `
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                ${subbedVideos.map(v => `
                                    <div onclick="navigateTo('watch', '${v.id}')" class="flex flex-col space-y-3 cursor-pointer group">
                                        <div class="w-full aspect-video bg-zinc-800 rounded-2xl overflow-hidden relative shadow-md">
                                            <img src="${v.thumbnail}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                        </div>
                                        <div class="flex space-x-3">
                                            <img src="${v.authorAvatar}" class="w-9 h-9 rounded-full bg-zinc-800">
                                            <div>
                                                <h3 class="text-sm font-bold text-white line-clamp-2">${parseMarkdown(v.title)}</h3>
                                                <p class="text-xs text-zinc-400 mt-1">${v.author}</p>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        // VIEW: UPLOAD (plus.html)
        function renderUploadView() {
            return `
                <div class="flex-1 overflow-y-auto p-4 sm:p-6">
                    <div class="max-w-2xl mx-auto bg-[#1f1f1f] border border-zinc-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
                        <div class="flex items-center space-x-3 border-b border-zinc-800 pb-4">
                            <div class="w-10 h-10 bg-red-600/20 text-red-500 rounded-xl flex items-center justify-center text-xl font-bold">
                                <i class="fas fa-upload"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold text-white">Neues Video hochladen</h2>
                                <p class="text-xs text-zinc-400">Dateien werden unter <code>/EliVideos/</code> strukturiert abgelegt.</p>
                            </div>
                        </div>

                        <form onsubmit="handleUploadSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 mb-1">Titel (*kursiv*, **fett**)</label>
                                <input type="text" id="upload-title" required placeholder="z.B. **Mein neues Video**" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 mb-1">Beschreibung (*kursiv*, **fett**)</label>
                                <textarea id="upload-desc" rows="3" placeholder="Schreibe etwas zum Video..." class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600"></textarea>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Video-Datei (mp4, mkv, webm, mov)</label>
                                    <input type="file" id="upload-video-file" accept="video/mp4,video/mkv,video/webm,video/quicktime" required class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-300 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:bg-zinc-800 file:text-white cursor-pointer">
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Thumbnail-Datei (Bild)</label>
                                    <input type="file" id="upload-thumb-file" accept="image/*" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-300 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:bg-zinc-800 file:text-white cursor-pointer">
                                </div>
                            </div>

                            <div class="bg-[#0f0f0f] border border-zinc-800 rounded-xl p-3 flex items-center justify-between">
                                <label class="flex items-center space-x-3 cursor-pointer">
                                    <input type="checkbox" id="upload-isshort" class="w-4 h-4 rounded border-zinc-700 bg-zinc-900 text-red-600">
                                    <span class="text-xs text-zinc-300 font-medium">Als EliClipz (Short / Vertikal) veröffentlichen</span>
                                </label>
                                <i class="fas fa-bolt text-yellow-500"></i>
                            </div>

                            <div class="flex justify-end space-x-3 pt-4 border-t border-zinc-800">
                                <button type="button" onclick="navigateTo('home')" class="px-5 py-2.5 text-xs text-zinc-400 hover:text-white font-semibold">Abbrechen</button>
                                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-6 py-2.5 rounded-xl shadow-lg shadow-red-600/30 transition">
                                    Veröffentlichen
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleUploadSubmit(e) {
            e.preventDefault();
            const title = document.getElementById('upload-title').value;
            const desc = document.getElementById('upload-desc').value;
            const isShort = document.getElementById('upload-isshort').checked;

            const videoFile = document.getElementById('upload-video-file').files[0];
            const thumbFile = document.getElementById('upload-thumb-file').files[0];

            if (!videoFile) {
                showToast('Bitte wähle eine Video-Datei aus!', true);
                return;
            }

            const videoUrl = URL.createObjectURL(videoFile);
            let thumbUrl = '';
            if (thumbFile) {
                thumbUrl = URL.createObjectURL(thumbFile);
            }

            store.addVideo({
                title: title,
                description: desc,
                url: videoUrl,
                thumbnail: thumbUrl,
                isShort: isShort
            });
        }

        // VIEW: PROFILE CUSTOMIZATION
        function renderProfileCustomizationView() {
            const user = store.currentUser;
            return `
                <div class="flex-1 overflow-y-auto p-4 sm:p-6">
                    <div class="max-w-2xl mx-auto bg-[#1f1f1f] border border-zinc-800 rounded-2xl overflow-hidden shadow-2xl">
                        <div class="w-full aspect-[5/1] bg-gradient-to-r from-red-900 via-purple-900 to-blue-900 relative group overflow-hidden">
                            ${user.banner ? `<img id="banner-preview" src="${user.banner}" class="w-full h-full object-cover">` : `<img id="banner-preview" class="w-full h-full object-cover hidden">`}
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                <span class="text-xs font-bold text-white bg-black/60 px-3 py-1.5 rounded-full">Banner Format 5:1</span>
                            </div>
                        </div>

                        <form onsubmit="handleProfileUpdateSubmit(event)" class="p-6 sm:p-8 space-y-6">
                            <div class="flex items-center space-x-4 border-b border-zinc-800 pb-6">
                                <div class="w-20 h-20 aspect-square rounded-full bg-zinc-800 border-2 border-red-600 overflow-hidden shrink-0 relative group">
                                    <img id="avatar-preview" src="${user.avatar}" class="w-full h-full object-cover">
                                </div>
                                <div>
                                    <h2 class="text-xl font-bold text-white">Kanal anpassen</h2>
                                    <p class="text-xs text-zinc-400">Profil wird in <code>/profile/${user.handle}.txt</code> indiziert.</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Banner ändern (Pflicht: 5:1)</label>
                                    <input type="file" id="prof-banner-file" accept="image/*" onchange="previewImage(this, 'banner-preview')" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-300 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:bg-zinc-800 file:text-white cursor-pointer">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Profilbild ändern (Pflicht: 1:1)</label>
                                    <input type="file" id="prof-avatar-file" accept="image/*" onchange="previewImage(this, 'avatar-preview')" class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-300 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-xs file:bg-zinc-800 file:text-white cursor-pointer">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 mb-1">Benutzername</label>
                                <input type="text" id="prof-username" value="${user.username}" required class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 mb-1">@Name (Eindeutig)</label>
                                <div class="relative">
                                    <span class="absolute left-4 top-2.5 text-zinc-500 text-sm">@</span>
                                    <input type="text" id="prof-handle" value="${user.handle}" required class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl pl-8 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-zinc-400 mb-1">Kanalbeschreibung</label>
                                <textarea id="prof-bio" rows="3" placeholder="Beschreibe deinen Kanal..." class="w-full bg-[#0f0f0f] border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600">${user.bio || ''}</textarea>
                            </div>

                            <div class="flex justify-end space-x-3 pt-4 border-t border-zinc-800">
                                <button type="button" onclick="navigateTo('home')" class="px-5 py-2.5 text-xs text-zinc-400 hover:text-white font-semibold">Abbrechen</button>
                                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-6 py-2.5 rounded-xl shadow-lg shadow-red-600/30 transition">
                                    Änderungen speichern
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function previewImage(input, targetId) {
            if (input.files && input.files[0]) {
                const url = URL.createObjectURL(input.files[0]);
                const img = document.getElementById(targetId);
                if (img) {
                    img.src = url;
                    img.classList.remove('hidden');
                }
            }
        }

        function handleProfileUpdateSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('prof-username').value;
            const handle = document.getElementById('prof-handle').value.replace('@', '');
            const bio = document.getElementById('prof-bio').value;
            const bannerFile = document.getElementById('prof-banner-file').files[0];
            const avatarFile = document.getElementById('prof-avatar-file').files[0];

            let bannerUrl = store.currentUser.banner;
            if (bannerFile) bannerUrl = URL.createObjectURL(bannerFile);

            let avatarUrl = store.currentUser.avatar;
            if (avatarFile) avatarUrl = URL.createObjectURL(avatarFile);

            const res = store.updateProfile({
                username,
                handle,
                bio,
                banner: bannerUrl,
                avatar: avatarUrl
            });

            if (res.success) {
                showToast('Profil erfolgreich aktualisiert & indiziert! ✨');
                renderApp();
            } else {
                showToast(res.msg, true);
            }
        }

        // MOBILE SIDEBAR TOGGLE
        let isMobileSidebarOpen = false;
        function toggleMobileSidebar() {
            isMobileSidebarOpen = !isMobileSidebarOpen;
            const sidebar = document.getElementById('app-sidebar');
            if (sidebar) {
                if (isMobileSidebarOpen) {
                    sidebar.classList.remove('hidden');
                    sidebar.classList.add('flex', 'absolute', 'left-0', 'top-16', 'bottom-0', 'z-40', 'w-64', 'shadow-2xl');
                } else {
                    sidebar.classList.add('hidden');
                    sidebar.classList.remove('flex', 'absolute', 'left-0', 'top-16', 'bottom-0', 'z-40', 'w-64', 'shadow-2xl');
                }
            }
        }

        // MAIN APPLICATION RENDER ROUTINER
        function renderApp() {
            const appEl = document.getElementById('app');

            if (!store.currentUser) {
                appEl.innerHTML = renderAuthView(isAuthRegisterMode);
                return;
            }

            let mainContent = '';
            switch (store.currentTab) {
                case 'clipz':
                    mainContent = renderClipzView();
                    break;
                case 'abos':
                    mainContent = renderAbosView();
                    break;
                case 'upload':
                    mainContent = renderUploadView();
                    break;
                case 'profile':
                    mainContent = renderProfileCustomizationView();
                    break;
                case 'home':
                case 'watch':
                default:
                    mainContent = renderHomeView();
                    break;
            }

            appEl.innerHTML = `
                ${renderHeader()}
                <div class="flex-1 flex overflow-hidden relative">
                    ${renderSidebar()}
                    ${mainContent}
                </div>
            `;
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
